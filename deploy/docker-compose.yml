# Hamma servislar ichki tarmoqda / 127.0.0.1 da — tashqariga faqat Caddy (80/443) ochiq.
# Serverda tizim Caddy bo'lsa (Farm Bot bilan bitta server) — u Caddyfile.host orqali 127.0.0.1:8100/3100 ga proxy qiladi,
# docker caddy ishga tushmaydi. Alohida serverda: docker compose --profile edge up -d
# Ishga tushirish: deploy/install.sh (serverda) yoki deploy/push.sh (Mac'dan)
name: neyrohelp
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: neyrohelp
      POSTGRES_USER: neyrohelp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60", "-c", "work_mem=4MB", "-c", "effective_cache_size=384MB"]
    volumes: [pgdata:/var/lib/postgresql/data, ./backups:/backups]
    mem_limit: 512m
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U neyrohelp"], interval: 10s, retries: 5 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    mem_limit: 96m

  api:
    build: ../apps/api
    image: neyrohelp-api
    restart: unless-stopped
    env_file: ./api.env
    environment:
      DATABASE_URL: postgresql+asyncpg://neyrohelp:${POSTGRES_PASSWORD}@postgres:5432/neyrohelp
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      WEB_INTERNAL_URL: http://web:3000
      MEDIA_DIR: /app/media
    volumes: ["${MEDIA_PATH:-/srv/neyrohelp/media}:/app/media"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["127.0.0.1:8100:8100"]
    mem_limit: 320m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  worker:
    # api bilan bitta image — install.sh faqat api'ni build qiladi, worker eski kodda qolmasin
    image: neyrohelp-api
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: ./api.env
    environment:
      DATABASE_URL: postgresql+asyncpg://neyrohelp:${POSTGRES_PASSWORD}@postgres:5432/neyrohelp
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      WEB_INTERNAL_URL: http://web:3000
    depends_on: [api]
    mem_limit: 160m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  web:
    build:
      context: ../apps/web
      # Build paytida API host tarmog‘ida 127.0.0.1:8100 da ochiq (avval `docker compose up -d api`).
      # compose build (bake) network.host ruxsatini bermaydi — install.sh `docker build --network host` bilan yig'adi
      args: { NEXT_PUBLIC_SITE_URL: "${SITE_URL:?}", API_INTERNAL_URL: "http://127.0.0.1:8100" }
      network: host
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8100
      NEXT_PUBLIC_SITE_URL: ${SITE_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?}
    ports: ["127.0.0.1:3100:3000"]
    mem_limit: 384m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  caddy:
    image: caddy:2-alpine
    profiles: [edge]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_HOST: ${SITE_HOST:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MEDIA_PATH:-/srv/neyrohelp/media}:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    mem_limit: 128m
    security_opt: [no-new-privileges:true]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
